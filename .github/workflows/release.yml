name: release

# Собирает musl-ядро и .apk на тег v*, прогоняет гейт (APK/суммы/тесты) и
# только затем публикует GitHub Release. Требования: Linux x86_64 (SDK OpenWrt),
# Rust + aarch64 musl toolchain.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake python3 \
            curl file zstd unzip git shellcheck jq gettext

      - name: aarch64 musl toolchain (musl.cc)
        run: |
          curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl.tgz
          sudo tar -xzf /tmp/musl.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Rust + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-musl

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ucode обязателен: без него критичные RPC-проверки M6 уходят в SKIP.
      - name: Install ucode (M6 backend)
        run: sh scripts/install-ucode.sh

      - name: Build core + APKs
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: sh scripts/build-all.sh

      # Гейт: контрольные суммы, M5/M6/M7 и rust fmt/clippy/unit.
      # Любой FAIL останавливает job — релиз не публикуется.
      - name: Release gate (verify APK / sums / tests)
        run: sh scripts/verify-release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dist/*.apk
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS \
            --title "CSQTT OpenWrt ${GITHUB_REF_NAME}" \
            --generate-notes
