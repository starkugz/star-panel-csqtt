# Конфигурация CSQTT-клиента для OpenWrt.
# ВАЖНО: device-id привязан к паролю на сервере — НЕ менять после первого запуска!

# Пир: адрес:порт сервера CSQTT
CSQTT_PEER="198.51.100.10:46000"

# Пароль подключения (WRAP-ключ)
CSQTT_PASSWORD="examplePassword1"

# Хеши VK через запятую (валидные на момент проверки)
CSQTT_VK="ExampleHashOne00000000000000000000000000,ExampleHashTwo00000000000000000000000000"

# Идентификатор устройства (ПРИВЯЗАН НА СЕРВЕРЕ — не менять!)
CSQTT_DEVICE_ID="11111111-2222-3333-4444-555555555555"

# TLS-фингерпринт: chrome | firefox
CSQTT_FINGERPRINT="chrome"

# Воркеры (кратно 9): 2 хеша x 3 группы x 9 = 54 максимум
CSQTT_WORKERS="18"

# Обфускация: audio | video
CSQTT_OBFS="audio"

# Транспорт TURN: udp | tcp | tcp_tls
CSQTT_TURN_TRANSPORT="udp"

# Имя TUN-интерфейса
CSQTT_TUN="csqtt0"

# Дополнительные аргументы (например --no-tun)
CSQTT_EXTRA_ARGS=""
